<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MajorMap legal and privacy information.">
  <title>MajorMap Legal</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #182343; background: #f6f7fb; }
    main { width: min(620px, 100%); padding: 40px; border: 1px solid #e3e7f1; border-radius: 24px; background: #fff; box-shadow: 0 18px 60px rgba(39, 54, 104, .10); }
    .brand { color: #4056c6; font-size: .76rem; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 10px 0 12px; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; }
    p { color: #667188; font-size: 1.05rem; line-height: 1.65; }
    a { display: inline-flex; margin-top: 14px; padding: 13px 18px; border-radius: 12px; color: #fff; background: #4056c6; font-weight: 750; text-decoration: none; }
    a:focus-visible { outline: 3px solid #9eabff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">MAJORMAP</div>
    <h1>Legal information</h1>
    <p>Read how MajorMap collects, uses, protects, and deletes personal information.</p>
    <a href="./privacy/">View Privacy Policy</a>
  </main>
</body>
</html>
